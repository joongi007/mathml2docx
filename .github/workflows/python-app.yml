name: Python package

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[latex,test]' build ruff
      - run: python -m pytest -q
      - name: Check utility docstrings through package imports
        run: |
          python - <<'PYCODE'
          import doctest
          from mathml2docx import utils
          failures, _ = doctest.testmod(utils, verbose=True)
          raise SystemExit(bool(failures))
          PYCODE
      - run: ruff check mathml2docx tests/test_v1.py tests/test_regressions.py tests/test_existing_fixes.py tests/test_extended.py tests/test_examples.py examples scripts skills/mathml2docx/scripts
      - run: ruff format --check mathml2docx tests/test_v1.py tests/test_regressions.py tests/test_existing_fixes.py tests/test_extended.py tests/test_examples.py examples scripts skills/mathml2docx/scripts
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.python-version }}
          path: dist/
