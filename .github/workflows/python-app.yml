name: Python package

on:
  push:
    branches: [master, compat/python36-uv]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  legacy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['python:3.6.15-slim-buster', 'python:3.7.17-slim-bullseye']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test legacy source and installed wheel
        run: bash scripts/test_legacy.sh '${{ matrix.image }}'

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.7'
      - run: uv sync --locked --no-default-groups --python '${{ matrix.python-version }}' --extra latex --extra markdown --extra test
      - run: .venv/bin/python -m unittest discover -v
      - name: Check utility docstrings through package imports
        run: |
          .venv/bin/python - <<'PY'
          import doctest
          from mathml2docx import utils
          result = doctest.testmod(utils, verbose=True)
          raise SystemExit(bool(result.failed))
          PY

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.7'
      - run: uv sync --locked --all-extras --group docs --group examples
      - run: uv run --no-sync python -m pytest -q
      - run: uv run --no-sync ruff check mathml2docx tests/test_v1.py tests/test_regressions.py tests/test_existing_fixes.py tests/test_extended.py tests/test_examples.py examples scripts skills/mathml2docx/scripts
      - run: uv run --no-sync ruff format --check mathml2docx tests/test_v1.py tests/test_regressions.py tests/test_existing_fixes.py tests/test_extended.py tests/test_examples.py examples scripts skills/mathml2docx/scripts
      - run: uv run --no-sync python scripts/build_docs.py
      - run: uv build
      - run: uv run --no-sync twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: package-distributions
          path: dist/
