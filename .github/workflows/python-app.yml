name: Python package

on:
  push:
    branches: [develop, compat/python36-uv]
  pull_request:
    branches: [master, develop]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/develop' || github.event_name == 'pull_request' }}

jobs:
  legacy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['python:3.6.15-slim-buster', 'python:3.7.17-slim-bullseye']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test legacy source and installed wheel
        run: bash scripts/test_legacy.sh '${{ matrix.image }}'

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.7'
      - run: uv sync --locked --no-default-groups --python '${{ matrix.python-version }}' --extra latex --extra markdown --extra test
      - run: .venv/bin/python -m unittest discover -v
      - run: .venv/bin/python -m pytest -q tests/test_math_audit_regressions.py tests/test_math_html_regressions.py
      - name: Check utility docstrings through package imports
        run: |
          .venv/bin/python - <<'PY'
          import doctest
          from mathml2docx import utils
          result = doctest.testmod(utils, verbose=True)
          raise SystemExit(bool(result.failed))
          PY

  platforms:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, python-version: '3.8'}
          - {os: windows-latest, python-version: '3.14'}
          - {os: macos-15, python-version: '3.14'}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.7'
      - run: uv sync --locked --no-default-groups --python '${{ matrix.python-version }}' --extra latex --extra markdown --extra test
      - run: uv run --no-sync --no-default-groups --python '${{ matrix.python-version }}' python -m unittest discover -v
      - run: uv run --no-sync --no-default-groups --python '${{ matrix.python-version }}' python -m pytest -q tests/test_math_audit_regressions.py tests/test_math_html_regressions.py

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.7'
      - run: uv sync --locked --all-extras --group docs --group examples
      - run: uv run --no-sync python -m pytest -q
      - run: uv run --no-sync python scripts/check_math_mutations.py
      - run: uv run --no-sync ruff check mathml2docx tests/test_v1.py tests/test_regressions.py tests/test_existing_fixes.py tests/test_extended.py tests/test_examples.py tests/test_math_validation.py tests/test_advanced_documents.py tests/test_math_policies.py tests/test_math_audit_regressions.py tests/test_math_html_regressions.py tests/test_math_template_regressions.py tests/test_math_oracle_regressions.py tests/test_word_comparison_regressions.py tests/test_rendering.py tests/test_docx_oracles.py tests/test_release_metadata.py tests/docx_oracle.py examples scripts
      - run: uv run --no-sync ruff format --check mathml2docx tests/test_v1.py tests/test_regressions.py tests/test_existing_fixes.py tests/test_extended.py tests/test_examples.py tests/test_math_validation.py tests/test_advanced_documents.py tests/test_math_policies.py tests/test_math_audit_regressions.py tests/test_math_html_regressions.py tests/test_math_template_regressions.py tests/test_math_oracle_regressions.py tests/test_word_comparison_regressions.py tests/test_rendering.py tests/test_docx_oracles.py tests/test_release_metadata.py tests/docx_oracle.py examples scripts
      - run: uv run --no-sync python scripts/build_docs.py
      - name: Validate mathematical and document structure against official schemas
        run: |
          uv run --no-sync python scripts/prepare_ecma_schema.py "$RUNNER_TEMP/ecma376"
          uv run --no-sync python scripts/validate_math_schema.py --schemas "$RUNNER_TEMP/ecma376" --docx-dir site/downloads/examples
      - run: uv build
      - run: uv run --no-sync python scripts/check_dist.py
      - run: uv run --no-sync twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: package-distributions
          overwrite: true
          path: dist/


  libreoffice:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.7'
      - name: Install Writer, Math and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-math poppler-utils fonts-noto-cjk fonts-stix
      - run: uv sync --locked --no-default-groups --extra latex --extra markdown --group examples
      - run: uv run --no-sync python -m examples.run_all
      - name: Verify formula import and actual PDF math rendering
        run: uv run --no-sync python scripts/render_examples.py --output examples/output/libreoffice-review
      - uses: actions/upload-artifact@v4
        with:
          name: libreoffice-previews
          path: examples/output/libreoffice-review/
