name: Publish to PyPI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.7'
      - name: Verify tag version and source on master
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          if [ "$RELEASE_EVENT" = push ]; then
            uv run --no-project --python 3.14 --with 'packaging>=24,<27' python scripts/check_release.py --tag "$RELEASE_TAG"
          else
            uv run --no-project --python 3.14 --with 'packaging>=24,<27' python scripts/check_release.py
          fi
      - name: Require TestPyPI upload and installation for this exact commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.14 python scripts/check_testpypi_run.py

  checks:
    needs: gate
    uses: ./.github/workflows/python-app.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.7'
      - run: uv build
      - run: uv run --no-project --python 3.14 python scripts/check_dist.py
      - run: uv run --no-project --python 3.14 --with 'twine>=6,<7' twine check dist/*
      - run: uv run --no-project --python 3.14 python scripts/check_wheel_install.py
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          overwrite: true
          path: dist/

  publish:
    # Creating a GitHub Release does not upload again. Only a validated final tag
    # can publish; workflow_dispatch validates/builds without uploading.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mathml2docx
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
