name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/python-app.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.7'
      - name: Verify release metadata and source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          if [ "$RELEASE_EVENT" = release ]; then
            uv run --no-project --python 3.14 --with 'packaging>=24,<27' python scripts/check_release.py --tag "$RELEASE_TAG" --prerelease "$RELEASE_PRERELEASE"
          else
            uv run --no-project --python 3.14 --with 'packaging>=24,<27' python scripts/check_release.py
          fi
      - run: uv build
      - run: uv run --no-project --python 3.14 python scripts/check_dist.py
      - run: uv run --no-project --python 3.14 --with 'twine>=6,<7' twine check dist/*
      - run: uv run --no-project --python 3.14 python scripts/check_wheel_install.py
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/

  test-publish:
    # Only an explicitly published candidate release uploads to TestPyPI.
    if: github.event_name == 'release' && github.event.release.prerelease
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/mathml2docx
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish:
    # Manual workflow_dispatch runs validate/build only. Upload requires an
    # explicitly published non-prerelease GitHub Release plus environment approval.
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mathml2docx
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
