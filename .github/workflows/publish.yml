name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/python-app.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.7'
      - name: Verify release version and source
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run --no-project --python 3.14 python - <<'PY'
          import ast, os, subprocess, tomllib
          from pathlib import Path
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          module = ast.parse(Path('mathml2docx/__init__.py').read_text())
          versions = [ast.literal_eval(node.value) for node in module.body
                      if isinstance(node, ast.Assign)
                      and any(isinstance(name, ast.Name) and name.id == '__version__'
                              for name in node.targets)]
          if versions != [project['version']]:
              raise SystemExit('Package __version__ and pyproject version must match')
          expected = 'v' + project['version']
          if os.environ['RELEASE_TAG'] != expected:
              raise SystemExit('Release tag must match package version: ' + expected)
          subprocess.run(['git', 'merge-base', '--is-ancestor', 'HEAD', 'origin/master'], check=True)
          PY
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/

  publish:
    # Manual workflow_dispatch runs validate/build only. Upload requires an
    # explicitly published non-prerelease GitHub Release plus environment approval.
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mathml2docx
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
