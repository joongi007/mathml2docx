[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mathml2docx"
version = "1.0.0"
authors = [
  { name="joongi007" },
]
description = "The fork in https://github.com/pqzx/html2docx converts html (including mathml) to docx"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["html", "mathml", "docx", "convert"]
dynamic = ["dependencies"]

[project.optional-dependencies]
latex = ["latex2mathml>=3.77,<4"]
markdown = ["Markdown>=3.5,<4"]
test = ["pytest>=8,<10", "docxtpl>=0.20,<1", "Markdown>=3.5,<4"]

[project.scripts]
mathml2docx = "mathml2docx.__main__:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["mathml2docx*"]
exclude = ["tests"]

[project.urls]
Documentation = "https://joongi007.github.io/mathml2docx/"
Repository = "https://github.com/joongi007/mathml2docx"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
python_files = ["test.py", "test_*.py"]
