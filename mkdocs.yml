site_name: mathml2docx
site_description: Convert HTML and MathML to editable Word documents with Python
site_url: https://joongi007.github.io/mathml2docx/
repo_url: https://github.com/joongi007/mathml2docx
edit_uri: edit/master/docs/
theme:
  name: mkdocs
  locale: en
  custom_dir: docs_theme
hooks:
- scripts/docs_hooks.py
exclude_docs: /ko/
extra:
  language: en
  language_label: Language
plugins:
- search:
    lang:
    - en
nav:
- Introduction: index.md
- User guide:
  - Getting started: 01-getting-started.md
  - API and options: 02-api.md
  - Recipes: 08-recipes.md
  - Migration to 1.0.0: 05-migration.md
- Examples:
  - Overview: examples/00-index.md
  - Quick start: examples/01_quickstart.md
  - Files, encoding, and Unicode: examples/02_files_unicode.md
  - Existing documents and cells: examples/03_existing_document.md
  - Inline formatting and colors: examples/04_inline_formatting.md
  - CSS stylesheets: examples/05_stylesheets.md
  - Word styles and class mapping: examples/06_word_styles.md
  - Paragraph layout and page breaks: examples/07_page_layout.md
  - Merged and nested tables: examples/08_tables.md
  - List numbering and nesting: examples/09_lists.md
  - Inline base64 images: examples/10_data_images.md
  - Local images: examples/11_local_images.md
  - Asset loaders and direct images: examples/12_asset_loader.md
  - MathML equations: examples/13_mathml.md
  - LaTeX equations: examples/14_latex.md
  - Inline markers and block replacement: examples/15_markers.md
  - Bookmark replacement: examples/16_bookmarks.md
  - docxtpl integration: examples/17_docxtpl.md
  - Options and settings copies: examples/18_options.md
  - Style helpers: examples/19_style_helpers.md
  - Links and anchors: examples/20_links.md
  - Combined report: examples/21_report.md
  - Markdown integration: examples/22_markdown.md
  - Complex equation gallery: examples/23_complex_equations.md
  - Equation-heavy mixed report: examples/24_dense_report.md
- Validation and limitations: 11-validation.md
- Project:
  - Documentation deployment: 04-publishing.md
  - Development and publishing: 09-development-release.md
  - XSL provenance: 06-xsl-provenance.md
  - Licensing scope: 10-licensing.md
  - Choosing a tool: 12-choosing.md
  - Upstream issue review: 07-upstream-audit.md
markdown_extensions:
- fenced_code
- tables
